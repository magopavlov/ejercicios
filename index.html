<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161b">
<title>Programa Semanal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161b; --surface:#1b1f27; --surface2:#242a35; --line:#2c3242;
    --text:#eceff3; --text-muted:#8892a3; --accent:#ff5b39; --accent-soft:rgba(255,91,57,.16);
    --warn:#ffb545; --warn-soft:rgba(255,181,69,.12); --ok:#3fd6c6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  body{padding-bottom:60px;}
  h1,h2,h3{font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  header.top{position:sticky; top:0; z-index:30; background:linear-gradient(180deg,var(--bg) 70%, transparent); padding:14px 16px 8px;}
  header.top .brand{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px;}
  header.top .brand h1{font-size:22px; margin:0; text-transform:uppercase; letter-spacing:.04em;}
  nav.days{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:4px;}
  nav.days::-webkit-scrollbar{display:none;}
  nav.days button{flex:0 0 auto; background:var(--surface); border:1px solid var(--line); color:var(--text-muted);
    padding:8px 12px; border-radius:10px; font-family:'Barlow Condensed',sans-serif; font-size:15px;
    font-weight:600; letter-spacing:.03em; text-transform:uppercase; cursor:pointer;}
  nav.days button .n{font-family:'IBM Plex Mono',monospace; font-size:10px; opacity:.6; display:block; margin-bottom:1px;}
  nav.days button.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
  main{padding:12px 16px 40px;}
  section.day{display:none;}
  section.day.active{display:block; animation:dayIn .2s ease;}
  @keyframes dayIn{ from{opacity:0; transform:translateX(10px);} to{opacity:1; transform:translateX(0);} }
  .daytitle h2{font-size:30px; margin:6px 0 0; text-transform:uppercase;}
  .daytitle .sub{color:var(--accent); font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:.08em;}
  .daytitle .dur{color:var(--text-muted); font-family:'IBM Plex Mono',monospace; font-size:11px; margin-top:3px;}
  .block{margin-top:22px;}
  .block > h3{font-size:19px; margin:0 0 8px; text-transform:uppercase; border-bottom:1px solid var(--line); padding-bottom:6px;}
  .block > h3 .cat{color:var(--text-muted); font-weight:500; font-size:13px; font-family:'IBM Plex Mono',monospace; text-transform:none; letter-spacing:0;}
  .blocknote{font-size:12px; color:var(--text-muted); margin:0 0 8px; line-height:1.5;}
  ul.plain{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px;}
  ul.plain li{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:9px 12px 9px 10px; font-size:14px; display:flex; align-items:center; gap:10px;}
  ul.plain li .txt{flex:1; display:flex; justify-content:space-between; gap:10px;}
  ul.plain li .dur{color:var(--text-muted); font-family:'IBM Plex Mono',monospace; font-size:12px; white-space:nowrap;}
  ul.plain li.done .txt > span:first-child{color:var(--text-muted); text-decoration:line-through;}
  .subgroup{margin-top:14px;}
  .subgroup > .label{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); margin-bottom:6px; font-family:'IBM Plex Mono',monospace;}
  .exrow{display:flex; align-items:stretch; gap:8px; margin-bottom:8px;}
  .exrow.done details.ex{opacity:.55;}
  .exrow.done .name{text-decoration:line-through;}
  details.ex{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; min-width:0;}
  details.ex[open]{border-color:#3a4258;}
  details.ex summary{list-style:none; cursor:pointer; padding:11px 12px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  details.ex summary::-webkit-details-marker{display:none;}
  details.ex summary .name{font-size:15.5px; font-weight:600; min-width:0;}
  details.ex summary .right{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
  details.ex summary .sets{color:var(--accent); font-family:'IBM Plex Mono',monospace; font-size:13px; white-space:nowrap;}
  details.ex summary .chev{color:var(--text-muted); font-size:12px; transition:transform .2s;}
  details.ex[open] summary .chev{transform:rotate(180deg);}
  details.ex .body{padding:0 12px 14px;}
  details.ex .tech{font-size:13.5px; color:var(--text-muted); line-height:1.55; margin:0;}
  details.ex .alt{font-size:13px; color:var(--text-muted); line-height:1.55; margin:9px 0 0; padding:8px 10px; background:var(--surface2); border-radius:8px;}
  details.ex .alt b{color:var(--ok); font-weight:600; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; display:block; margin-bottom:3px;}
  details.ex .flag{font-size:13px; line-height:1.55; margin:9px 0 0; padding:8px 10px; background:var(--warn-soft); border-left:2px solid var(--warn); border-radius:6px; color:#e8d5b0;}
  .checkwrap{flex:0 0 auto; display:flex; align-items:center; justify-content:center; width:44px;}
  input.check{appearance:none; -webkit-appearance:none; width:26px; height:26px; border-radius:8px; border:2px solid var(--line);
    background:var(--surface); cursor:pointer; position:relative; flex:0 0 auto;}
  input.check:checked{background:var(--accent); border-color:var(--accent);}
  input.check:checked::after{content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#14161b; font-size:16px; font-weight:700;}
  .progress{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-muted);}
  .progress b{color:var(--accent);}
  .resetbtn{background:none; border:1px solid var(--line); color:var(--text-muted); font-family:'IBM Plex Mono',monospace;
    font-size:11px; padding:4px 9px; border-radius:7px; cursor:pointer; text-transform:uppercase; letter-spacing:.04em;}
  .infobox{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px;}
  .infobox.alert{border-color:var(--warn); background:var(--warn-soft);}
  .infobox.alert h3{color:var(--warn);}
  .infobox h3{margin:0 0 8px; font-size:18px; text-transform:uppercase;}
  .infobox ul{margin:0; padding-left:18px; font-size:14px; color:var(--text-muted); line-height:1.65;}
  .infobox.alert ul, .infobox.alert p{color:#e8d5b0;}
  .infobox p{font-size:14px; color:var(--text-muted); line-height:1.65; margin:0 0 8px;}
  .infobox p:last-child{margin-bottom:0;}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>Programa Semanal</h1></div>
  <nav class="days" id="dayNav"></nav>
</header>
<main id="main"></main>

<script>
function ex(name, sets, tech, alt, flag){ return {name, sets, tech, alt, flag}; }

const DAYS = [
{key:"info", label:"Info", num:"", info:true},

/* ================= LUNES ================= */
{key:"lunes", label:"Lunes", num:"01", sub:"Torso A — empuje", dur:"≈ 90 min", sections:[
  { title:"Entrada en calor", type:"text", dur:"5 min", items:["Bicicleta suave · 5 min"] },

  { title:"Movilidad", type:"groups", note:"Sin pausa entre ejercicios, una ronda continua.", groups:[{label:"Torácica y hombro", items:[
    ex("Cat-Camel","×10","En cuatro apoyos, alterná entre arquear la espalda hacia el techo y hundirla, moviendo vértebra por vértebra. Respirá continuo, sin apretar el abdomen.",
      "Igual, no necesita equipo."),
    ex("Rotaciones torácicas","×10 por lado","En cuatro apoyos, mano en la nuca, abrí el codo hacia el techo rotando desde la espalda alta. Seguí el codo con la mirada.",
      "Igual, no necesita equipo."),
    ex("Wall Slides","×10","Espalda contra la pared, brazos en 'W' apoyados. Deslizá hacia arriba sin despegar muñecas ni codos, y bajá controlando.",
      "Igual, solo necesitás una pared."),
    ex("Band Pull Apart","×15","Banda entre las manos a la altura del pecho, brazos casi extendidos. Separá las manos juntando los omóplatos.",
      "Este ya es con banda — llevala siempre en el bolso de viaje."),
    ex("Shoulder CARs","×5 por lado","Círculo lento y completo con el brazo, buscando el máximo rango sin compensar con la espalda. Lento es el punto.",
      "Igual, no necesita equipo.")
  ]}]},

  { title:"Hipertrofia", type:"groups", note:"RIR 2-3 en todo. Exhalá siempre en el esfuerzo, nunca aguantes el aire.", groups:[
    { label:"Pecho", items:[
      ex("Press de pecho en máquina","3×10-12","Sentado con espalda apoyada, manijas a la altura del pecho. Empujá exhalando hasta casi extender, sin trabar codos. Bajá en 2-3 segundos.",
        "Press con banda: banda anclada atrás a la altura del pecho, un extremo en cada mano, empujás al frente. 3×15-20.",
        "Si al empujar sentís presión o bulto en la ingle o el ombligo, bajá el peso. No es señal de esforzarte más."),
      ex("Press inclinado con mancuernas","3×10-12","Banco a 30-45°. Bajá las mancuernas a los lados del pecho y empujá arriba y levemente hacia adentro. Peso moderado, controlado.",
        "Flexiones inclinadas (manos en una mesa o el borde de la cama). Cuanto más alto el apoyo, más fácil. 3×10-15."),
      ex("Aperturas / Pec Deck","3×12-15","Codos con leve flexión fija, juntá los brazos al frente del pecho. Movimiento amplio, peso liviano — es el ejercicio de menos carga axial del día.",
        "Aperturas con banda: banda anclada atrás, brazos abiertos, los juntás al frente. 3×15-20.")
    ]},
    { label:"Hombros", items:[
      ex("Elevaciones laterales","3×15","Mancuernas a los costados, leve quiebre de codo, subí hasta la altura del hombro. Sin impulso, sin encoger el trapecio.",
        "Con banda pisada: parado sobre el centro de la banda, subís los brazos a los costados. 3×15-20."),
      ex("Face Pull","3×15","Polea o banda a la altura de la cara. Tirá llevando los codos altos y atrás, separando las manos al final. Es el ejercicio que te compensa toda la postura de empuje.",
        "Con banda anclada en una puerta o un poste, misma ejecución.")
    ]},
    { label:"Tríceps", items:[
      ex("Tríceps en polea o banda","3×12-15","Codos fijos pegados al torso, extendé los antebrazos hacia abajo hasta estirar del todo. Solo se mueve el codo.",
        "Con banda anclada arriba (marco de puerta), misma ejecución. 3×15-20."),
      ex("Extensión de tríceps sobre la cabeza","3×12","Una mancuerna con las dos manos o banda, codos apuntando al techo, bajás detrás de la nuca y extendés.",
        "Con banda pisada por detrás, tirás hacia arriba desde la nuca.",
        "Si notás presión abdominal al levantar los brazos sobre la cabeza, hacelo sentado con respaldo.")
    ]}
  ]},

  { title:"Core seguro", type:"groups", note:"Nada de abdominales clásicos, elevaciones de piernas ni plancha frontal larga. Estos son antirrotación y antiextensión, que es lo que sí podés.", groups:[{label:"Core", items:[
    ex("Pallof Press","3×12 por lado","De pie, banda o polea a la altura del pecho desde un costado. Empujá el mango al frente resistiendo que el torso rote. Respirá normal durante todo el ejercicio.",
      "Con banda anclada en una puerta, igual.",
      "Este es el ejercicio de core más seguro para tu caso: no flexiona el tronco ni sube la presión abdominal."),
    ex("Bird Dog","3×10 por lado","En cuatro apoyos, extendé brazo y pierna contrarios sin que la cadera rote ni la lumbar se hunda. Pausa de 2 segundos arriba.",
      "Igual, no necesita equipo.")
  ]}]},

  { title:"Cardio", type:"text", dur:"15 min", items:["Bicicleta Zona 2 · 15 min"] },

  { title:"Stretching", type:"text", note:"30 segundos cada uno, respiración tranquila.", items:["Pectoral en marco de puerta · 30s","Dorsal · 30s","Trapecio · 30s","Tríceps · 30s","Cuello lateral · 30s"] }
]},

/* ================= MARTES ================= */
{key:"martes", label:"Martes", num:"02", sub:"Piernas A + tobillo izq.", dur:"≈ 90 min", sections:[
  { title:"Entrada en calor", type:"text", dur:"5 min", items:["Bicicleta suave · 5 min"] },

  { title:"Movilidad de cadera y tobillo", type:"groups", note:"Prioridad de la semana: cadera derecha y dorsiflexión del tobillo izquierdo.", groups:[{label:"Movilidad", items:[
    ex("Knee to Wall — tobillo izquierdo","3×10","Pie a unos centímetros de la pared, llevá la rodilla a tocar la pared sin despegar el talón. Alejá el pie hasta el límite donde todavía llegás. Medí esa distancia con los dedos y anotala mentalmente: es tu marcador de progreso.",
      "Igual, solo necesitás una pared.",
      "Hacelo también con el derecho para comparar, pero el doble de volumen en el izquierdo (por eso 3 series de ese lado)."),
    ex("Movilización de tobillo con banda","2×10 por lado","Banda enganchada a un poste bajo, pasala por delante del tobillo tirando hacia atrás. Con el pie apoyado, llevá la rodilla al frente contra la tracción de la banda.",
      "Es con banda, ya es la versión portátil.",
      "Este es el que más te va a mover la dorsiflexión izquierda. No lo saltees."),
    ex("90/90 Hip Switch","×10","Sentado, ambas piernas a 90°, rotá las caderas llevando las rodillas de un lado al otro sin usar las manos si podés.",
      "Igual, no necesita equipo."),
    ex("Hip CARs — cadera derecha","×5 por lado","Parado con apoyo, llevá la rodilla al frente, luego afuera, atrás y abajo, círculo completo y lentísimo. Sin mover la pelvis.",
      "Igual, no necesita equipo."),
    ex("Puente de glúteos","×15","Boca arriba, rodillas flexionadas, subí la cadera apretando glúteos. Exhalá al subir. No arquees la lumbar para subir más.",
      "Igual, no necesita equipo.")
  ]}]},

  { title:"Hipertrofia", type:"groups", note:"Cargas moderadas. Preferí máquinas y apoyos: te dejan trabajar la pierna sin cargar la pared abdominal.", groups:[{label:"Piernas", items:[
    ex("Prensa","3×12-15","Pies al ancho de hombros, bajá controlando hasta ~90° de rodilla y empujá exhalando. Sin trabar rodillas arriba.",
      "Sentadilla goblet liviana con mochila cargada, o sentadilla con banda. 3×15.",
      "Peso moderado, no busques tu máximo. La prensa es de los ejercicios que más presión abdominal genera si te pasás de carga."),
    ex("Hip Thrust","3×12-15","Espalda apoyada en un banco, pies firmes, subí la cadera apretando glúteos arriba 1 segundo. Exhalá al subir.",
      "Puente de glúteos a una pierna, o con banda sobre la cadera. 3×15 por pierna.",
      "Es de los mejores ejercicios para vos: mucho glúteo, poca carga sobre el abdomen. Mantenelo."),
    ex("Curl femoral","3×12","Sentado o acostado en la máquina, flexioná las rodillas llevando el talón hacia el glúteo. Bajá lento.",
      "Curl con banda: banda anclada baja al tobillo, flexionás la rodilla. O deslizamientos de talón sobre piso liso. 3×12-15."),
    ex("Extensión de cuádriceps","3×12-15","Sentado, extendé las rodillas hasta casi trabar, pausa arriba 1 segundo, bajá controlando.",
      "Sentadilla búlgara con peso corporal (pie de atrás en una silla). 3×10-12 por pierna."),
    ex("Abducción de cadera","3×15","Sentado en máquina o de pie con banda, separá las piernas hacia afuera sin rotar el torso. Pausa 1 segundo al final del rango.",
      "Con banda sobre las rodillas, sentado o acostado de costado. 3×15-20."),
    ex("Gemelos sentado (sóleo)","4×15","Rodillas a 90°, elevá los talones al máximo y bajá lento hasta sentir el estiramiento. El sóleo es clave para tu fascitis, no lo saltees.",
      "Sentado con una mochila cargada sobre las rodillas, elevás talones. 4×20.")
  ]}]},

  { title:"Protocolo pie izquierdo", type:"groups", note:"Trabajo específico para la fascitis. Todos con foco en el pie izquierdo; hacé el derecho también pero con menos volumen.", groups:[{label:"Pie y tobillo", items:[
    ex("Elevación de talón lenta con toalla bajo los dedos","3×12","Parado en un escalón, toalla enrollada bajo los dedos para que queden extendidos. Subí en 3 segundos, pausa 2 arriba, bajá en 3 segundos. Este tempo lento y la posición de los dedos son lo que hace efectivo el ejercicio para la fascia plantar.",
      "Cualquier escalón sirve, y una toalla o remera enrollada.",
      "Es el ejercicio con más respaldo para fascitis plantar. Día por medio, no todos los días."),
    ex("Short Foot (Doming)","3×10 (mantener 5s)","Sentado, sin curvar los dedos, acortá el pie llevando la base de los dedos hacia el talón para levantar el arco. Cuesta al principio, es normal.",
      "No necesita equipo."),
    ex("Elevaciones de tibial anterior","3×15","Sentado o parado con talones apoyados, elevá la punta del pie lo más alto posible. Trabaja el músculo que te está limitando la dorsiflexión.",
      "Sentado en una silla, o parado apoyado contra la pared."),
    ex("Equilibrio en un pie","3×30s por pie","Parado sobre un pie, mirada al frente, sin agarrarte. Cuando te salga fácil, cerrá los ojos.",
      "No necesita equipo."),
    ex("Liberación plantar con pelota","2 min por pie","Pelota de tenis o similar bajo la planta, rodá lento buscando los puntos sensibles. Presión firme pero tolerable.",
      "Una pelota chica entra en cualquier valija.")
  ]}]},

  { title:"Stretching", type:"text", note:"30-45 segundos cada uno. Gemelo y sóleo del lado izquierdo, hacelos dos veces.", items:["Gemelo en pared · 45s","Sóleo (rodilla flexionada) · 45s","Fascia plantar (tirar dedos hacia atrás) · 30s","Cuádriceps · 30s","Isquiotibiales · 30s","Glúteo / figura 4 · 30s","Flexor de cadera · 30s"] }
]},

/* ================= MIÉRCOLES ================= */
{key:"miercoles", label:"Miércoles", num:"03", sub:"Cardio Z2 + movilidad", dur:"≈ 60 min", sections:[
  { title:"Cardio", type:"text", dur:"35-40 min", note:"Zona 2 = podés mantener una conversación entrecortada. Si vas en bici afuera, terreno llano o suave.", items:["Bicicleta Zona 2 · 35-40 min"] },

  { title:"Movilidad completa", type:"groups", note:"Día de recuperación activa: apuntá a rango de movimiento, no a esfuerzo.", groups:[{label:"Cuerpo completo", items:[
    ex("Cat-Camel","×10","En cuatro apoyos, alterná arquear y hundir la espalda moviendo vértebra por vértebra.","No necesita equipo."),
    ex("Rotaciones torácicas","×10 por lado","Mano en la nuca, abrí el codo hacia el techo rotando desde la espalda alta.","No necesita equipo."),
    ex("90/90 Hip Switch","×10","Rotá las caderas llevando las rodillas de un lado al otro, sentado con ambas piernas a 90°.","No necesita equipo."),
    ex("Hip CARs","×5 por lado","Círculo completo y lento con la rodilla, sin mover la pelvis. Prestale más atención a la derecha.","No necesita equipo."),
    ex("World's Greatest Stretch","×6 por lado","Desde estocada larga, mano de adentro al piso, rotá el torso y abrí el otro brazo al techo. Es el que más rango de cadera te da por minuto invertido.","No necesita equipo."),
    ex("Rock backs en cuadrupedia","×12","En cuatro apoyos, llevá la cadera hacia los talones y volvé. Abrí un poco las rodillas para trabajar aductores.","No necesita equipo."),
    ex("Couch Stretch","2×30s por lado","De rodillas frente a un sofá o pared, pie de atrás apoyado en él, empujá la cadera al frente. Mantené el abdomen relajado y respirá.","Sirve cualquier sofá, cama o pared."),
    ex("Sentadilla profunda asistida","3×30s","Agarrado de algo firme, bajá a sentadilla completa y quedate ahí relajando cadera y tobillos. Apoyá bien el talón izquierdo.","Agarrate del marco de una puerta."),
    ex("Knee to Wall — tobillo izquierdo","2×10","Rodilla a la pared sin despegar el talón. Compará con el derecho.","Solo necesitás una pared.")
  ]}]},

  { title:"Stretching completo", type:"text", note:"45 segundos cada uno. Este es el día de estiramiento largo de la semana.", items:["Pectorales · 45s","Dorsales · 45s","Trapecios · 45s","Flexores de cadera · 45s","Aductores · 45s","Glúteos · 45s","Piriforme · 45s","Isquiotibiales · 45s","Cuádriceps · 45s","Gemelos · 45s","Sóleo · 45s","Fascia plantar · 45s"] }
]},

/* ================= JUEVES ================= */
{key:"jueves", label:"Jueves", num:"04", sub:"Torso B — tracción", dur:"≈ 90 min", sections:[
  { title:"Entrada en calor", type:"text", dur:"5 min", items:["Bicicleta suave · 5 min"] },

  { title:"Movilidad", type:"groups", groups:[{label:"Torácica y hombro", items:[
    ex("Cat-Camel","×10","Alterná arquear y hundir la espalda en cuatro apoyos.","No necesita equipo."),
    ex("Rotaciones torácicas","×10 por lado","Mano en la nuca, abrí el codo hacia el techo.","No necesita equipo."),
    ex("Wall Slides","×10","Espalda en la pared, deslizá los brazos en 'W' hacia arriba sin despegarlos.","Solo necesitás una pared."),
    ex("Band Pull Apart","×15","Separá la banda a la altura del pecho juntando omóplatos.","Ya es con banda."),
    ex("Shoulder CARs","×5 por lado","Círculo lento y completo con el brazo, máximo rango.","No necesita equipo.")
  ]}]},

  { title:"Hipertrofia", type:"groups", note:"Los ejercicios de tracción sentado y con pecho apoyado son ideales para vos: te sacan la carga del abdomen.", groups:[
    { label:"Espalda", items:[
      ex("Jalón al pecho agarre neutro","3×10-12","Sentado, tirá la barra hacia la parte alta del pecho llevando los codos abajo y atrás. No te tires para atrás con el torso.",
        "Banda anclada arriba (marco de puerta), tirás hacia abajo desde arrodillado. 3×15."),
      ex("Remo sentado en polea","3×10-12","Tirá hacia el abdomen llevando codos atrás y juntando omóplatos. Torso quieto, sin balanceo.",
        "Remo con banda sentado en el piso, banda alrededor de los pies. 3×15."),

/* ============ Render ============ */
let CHECK_ID = 0;
function exerciseCard(e, dayKey){
  const id = `${dayKey}_${CHECK_ID++}`;
  const alt = e.alt ? `<div class="alt"><b>En casa / viajando</b>${e.alt}</div>` : "";
  const flag = e.flag ? `<div class="flag">${e.flag}</div>` : "";
  return `<div class="exrow" data-id="${id}">
    <label class="checkwrap"><input type="checkbox" class="check" data-id="${id}"></label>
    <details class="ex"><summary><span class="name">${e.name}</span>
      <span class="right"><span class="sets mono">${e.sets}</span><span class="chev">▾</span></span></summary>
      <div class="body"><p class="tech">${e.tech}</p>${alt}${flag}</div></details>
  </div>`;
}
function textBlock(sec, dayKey){
  const note = sec.note ? `<p class="blocknote">${sec.note}</p>` : "";
  const items = sec.items.map(i=>{
    const id = `${dayKey}_${CHECK_ID++}`;
    let a=i, b="";
    if(i.includes("·")){ [a,b]=i.split("·"); }
    return `<li data-id="${id}"><label class="checkwrap" style="width:34px;"><input type="checkbox" class="check" data-id="${id}"></label>
      <span class="txt"><span>${a.trim()}</span><span class="dur">${b.trim()}</span></span></li>`;
  }).join("");
  return `<div class="block"><h3>${sec.title}${sec.dur?` <span class="cat">${sec.dur}</span>`:""}</h3>${note}<ul class="plain">${items}</ul></div>`;
}
function groupsBlock(sec, dayKey){
  const note = sec.note ? `<p class="blocknote">${sec.note}</p>` : "";
  const groups = sec.groups.map(g=>`<div class="subgroup"><div class="label">${g.label}</div>${g.items.map(e=>exerciseCard(e,dayKey)).join("")}</div>`).join("");
  return `<div class="block"><h3>${sec.title}</h3>${note}${groups}</div>`;
}

    <div class="block">
      <div class="infobox alert"><h3>Reglas por las hernias</h3>

          <li><b>Nunca aguantes el aire.</b> Exhalá siempre durante el esfuerzo. La maniobra de Valsalva es lo que más presión genera sobre la hernia.</li>

          <li><b>Nada de abdominales clásicos</b>, elevaciones de piernas colgado, ni plancha frontal larga.</li>
          <li><b>Test del abultamiento:</b> si al hacer fuerza ves una cresta o bulto en el abdomen, o sentís presión en la ingle o el ombligo, pará ese ejercicio.</li>

        </ul>
      </div>

      <div class="infobox"><h3>Objetivos</h3><ul>
        <li>Hipertrofia con cargas moderadas y seguras</li>

    </div>`;

function renderDay(day){
  if(day.info) return infoPage();
  const sections = day.sections.map(sec => sec.type==="text" ? textBlock(sec, day.key) : groupsBlock(sec, day.key)).join("");
  return `<div class="daytitle"><h2>${day.label}</h2><div class="sub">${day.sub}</div>
    <div class="dur">${day.dur}</div>
    <div style="display:flex; align-items:center; justify-content:space-between; margin-top:8px;">
      <div class="progress" id="prog-${day.key}"></div>
      <button class="resetbtn" data-reset="${day.key}">Reiniciar día</button>
    </div></div>${sections}`;
}

/* ---- Persistencia ---- */
const STORE_KEY = "rutina_checks_v2";
const WEEK_KEY = "rutina_week_v2";
function mondayOf(d){
  d = new Date(d);
  const day = (d.getDay()+6)%7;
  d.setDate(d.getDate()-day);
  d.setHours(0,0,0,0);
  return d.toISOString().slice(0,10);
}
function loadChecks(){
  try{
    const thisMonday = mondayOf(new Date());
    if(localStorage.getItem(WEEK_KEY) !== thisMonday){
      localStorage.setItem(STORE_KEY, "{}");
      localStorage.setItem(WEEK_KEY, thisMonday);
    }
    return JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
  }catch(e){ return {}; }
}
let checks = {};
function saveChecks(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(checks)); }catch(e){} }

function updateProgress(dayKey){
  const section = document.getElementById("day-"+dayKey);
  if(!section) return;
  const boxes = section.querySelectorAll("input.check");
  const done = [...boxes].filter(b=>b.checked).length;
  const el = document.getElementById("prog-"+dayKey);
  if(el) el.innerHTML = boxes.length ? `<b>${done}</b>/${boxes.length} completados` : "";
}
function applyChecksToDOM(){
  document.querySelectorAll("input.check").forEach(box=>{
    box.checked = !!checks[box.dataset.id];
    const row = box.closest(".exrow") || box.closest("li");
    if(row) row.classList.toggle("done", box.checked);
  });
  DAYS.forEach(d => { if(!d.info) updateProgress(d.key); });
}

function init(){
  const nav = document.getElementById("dayNav");
  const main = document.getElementById("main");
  DAYS.forEach((day, idx) => {
    const btn = document.createElement("button");
    btn.innerHTML = `<span class="n">${day.num}</span>${day.label}`;
    btn.dataset.key = day.key;
    if(idx===0) btn.classList.add("active");
    btn.addEventListener("click", () => selectDay(day.key));
    nav.appendChild(btn);
    const section = document.createElement("section");
    section.className = "day" + (idx===0 ? " active" : "");
    section.id = "day-" + day.key;
    section.innerHTML = renderDay(day);
    main.appendChild(section);
  });

  let currentKey = DAYS[0].key;
  function selectDay(key){
    currentKey = key;
    document.querySelectorAll("nav.days button").forEach(b => b.classList.toggle("active", b.dataset.key===key));
    document.querySelectorAll("section.day").forEach(s => s.classList.toggle("active", s.id==="day-"+key));
    const activeBtn = nav.querySelector(`button[data-key="${key}"]`);
    if(activeBtn && activeBtn.scrollIntoView) activeBtn.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
    window.scrollTo({top:0, behavior:"instant"});
  }

  let tsX=0, tsY=0, tsT=0;
  main.addEventListener("touchstart", (e) => {
    const t = e.touches[0]; tsX=t.clientX; tsY=t.clientY; tsT=Date.now();
  }, {passive:true});
  main.addEventListener("touchend", (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - tsX, dy = t.clientY - tsY, dt = Date.now() - tsT;
    if(Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.6 && dt < 700){
      const idx = DAYS.findIndex(d => d.key === currentKey);
      const target = dx < 0 ? DAYS[idx+1] : DAYS[idx-1];
      if(target) selectDay(target.key);
    }
  }, {passive:true});

  checks = loadChecks();
  applyChecksToDOM();

  main.addEventListener("change", (e) => {
    if(!e.target.classList.contains("check")) return;
    checks[e.target.dataset.id] = e.target.checked;
    saveChecks();
    const row = e.target.closest(".exrow") || e.target.closest("li");
    if(row) row.classList.toggle("done", e.target.checked);
    updateProgress(e.target.dataset.id.split("_")[0]);
  });

  main.addEventListener("click", (e) => {
    const btn = e.target.closest(".resetbtn");
    if(!btn) return;
    const dayKey = btn.dataset.reset;
    document.getElementById("day-"+dayKey).querySelectorAll("input.check").forEach(box=>{
      checks[box.dataset.id] = false;
      box.checked = false;
      const row = box.closest(".exrow") || box.closest("li");
      if(row) row.classList.remove("done");
    });
    saveChecks();
    updateProgress(dayKey);
  });
}
document.addEventListener("DOMContentLoaded", init);
if("serviceWorker" in navigator){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
